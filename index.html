<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>管家婆 (Supabase版)</title>
        <link rel="stylesheet" type="text/css" href="default_full.css">
            <!--<link rel="stylesheet" type="text/css" href="header_black.css">-->
        <link rel="stylesheet" type="text/css" href="lightform.css">
        <link rel="stylesheet" type="text/css" href="sidebar.css">
        <link rel="stylesheet" type="text/css" href="snackbar.css">
        <link rel="stylesheet" type="text/css" href="float_button.css">
        <!-- 引入 Supabase JS 客户端库 -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
    <style type="text/css">
        article img {
            border-radius: 10px;
            float: left;
            width: 100px;
            height: 100px;
        }
        article li div {
            padding: 10px;
            margin: 0 auto;
        }
        article li p {
            margin: 0 auto;
            padding: 5px;
        }
        article ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
        article li {
            padding: 5px;
            height: 100px;
            border-bottom: 1px lightgray solid;
        }
        article li:hover {
            background: #eee;
            cursor: pointer;
        }
        h4 {
            display: inline-block;
            font-size: 25px;
            margin: 0px;
            padding: 0px;
        }
        fieldset {
            margin-top: 30px;
            margin-left: 15px;
        }
        h5 {
            font-size: 19px;
        }
    </style>
    <body>
    <!--
        <header>
            <h3>
                <span onclick="document.getElementById('sidebar_left').style.width='360px'">&#9776;&nbsp;</span>
                <span onclick="updatedata()"><script type="text/javascript">document.write(document.title)</script></span>
            </h3>
        </header>
    -->

            <article>
                <ul id="salelist"></ul>
            </article>

            <div id="sidebar_left" class="sidebar_left">
                <span class="close" onclick="this.parentElement.style.width = '0';">&times;</span>
                <form id="find">
                    <fieldset>
                        <legend>统计设置</legend>
                        <input type="date" id="start_date" name="start_date">
                        <input type="date" id="end_date" name="end_date">

                        <select id="find_style">
                            <option value="monthly">月汇总表</option>
                            <option value="daily">日汇总表</option>
                            <option value="product">商品汇总表</option>
                            <option value="list">明细表</option>
                        </select>

                        <input type="button" value="开始" onclick="sum()">
                        <input type="button" value="关闭" onclick="document.getElementById('sidebar_left').style.width = '0';">
                    </fieldset>
                </form>
            </div>
        </main>

        <div id="sidebar_right" class="sidebar_right">
            <span class="close" onclick="this.parentElement.style.width = '0';">&times;</span>
            <fieldset>
                <legend>新销售单</legend>
                <form id="form" onsubmit="submitSale(event)">
                    <input type="date" id="sdate" name="date">
                    <input type="number" id="pid" name="pid" value="0" readonly>
                    <select id="pdname" onchange="getpd()"></select>

                    <input type="number" id="pdnum" name="number" placeholder="销售数量" onFocus="this.select()" onkeyup="upamount()">
                    <input type="number" id="pdprice" name="price" placeholder="销售单价" onFocus="this.select()" onkeyup="upamount()">
                    <input type="number" id="pdamount" name="amount" placeholder="销售金额" onFocus="this.select()">
                    <input type="number" id="pdcost" name="cost" placeholder="销售成本" onFocus="this.select()">
                    <input type="text" id="remark" name="remark" placeholder="备注" onFocus="this.select()">
                    <input type="submit" value="提交">
                    <input type="button" value="关闭" onclick="document.getElementById('sidebar_right').style.width = '0';">
                </form>
            </fieldset>
        </div>

        <div id="dialog" class="dialog">
            <span class="close" onclick="this.parentElement.style.display = 'none';">&times;</span>
        </div>
        <button onclick="document.getElementById('sidebar_left').style.width='360px'" class="float_button_top" id="sum_button" title="sum_bitton">&#9776;</button>
        <button onclick="document.getElementById('sidebar_right').style.width='360px'" class="float_button_bottom" id="add" title="add">&#43;</button>

        <div id="snackbar"></div>

        <script type="text/javascript">
            // ===== 请在这里配置你的 Supabase 项目信息 =====
            const SUPABASE_URL = 'https://epalmdhbvqqfnakcqbgl.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwYWxtZGhidnFxZm5ha2NxYmdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMzEzNjYsImV4cCI6MjEwNzYwNzM2Nn0.i4EqfRxfkFrX7gQKD3F8Q41OIoabZfIDTRkcFvAO3AA';

            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            var prod = [], prodnum = 0;

            var td = new Date().toISOString().substring(0, 10);
            var sd = new Date().toISOString().substring(0, 8) + "01";
            document.getElementById('sdate').value = td;
            document.getElementById('start_date').value = sd;
            document.getElementById('end_date').value = td;

            window.onload = function() {
                uppd();
                updatedata();
            };

            // 1. 获取商品列表填充下拉框
            async function uppd() {
                const { data, error } = await supabaseClient
                    .from('product')
                    .select('*')
                    .order('pid', { ascending: true });

                if (error) {
                    console.error('获取商品失败:', error);
                    return;
                }

                prod = data;
                prodnum = prod.length;
                var sel = document.getElementById("pdname");
                sel.innerHTML = "";

                let option = document.createElement('option');
                option.text = "选取商品";
                option.value = 0;
                sel.appendChild(option);

                for (var i = 0; i < prodnum; i++) {
                    let opt = document.createElement('option');
                    opt.text = prod[i].name;
                    opt.value = prod[i].pid;
                    sel.appendChild(opt);
                }
            }

            // 选择商品联动填充单价、成本等
            function getpd() {
                let pid = document.getElementById("pdname").value;
                if (pid == 0) {
                    document.getElementById("pid").value = "0";
                    return;
                }

                for (var i = 0; i < prodnum; i++) {
                    if (prod[i].pid == pid) {
                        document.getElementById("pid").value = prod[i].pid;
                        document.getElementById("pdnum").value = 1;
                        document.getElementById("pdprice").value = prod[i].price;
                        document.getElementById("pdamount").value = prod[i].price * 1;
                        document.getElementById("pdcost").value = prod[i].cost;
                    }
                }
            }

            // 计算销售金额
            function upamount() {
                let num = parseFloat(document.getElementById("pdnum").value) || 0;
                let price = parseFloat(document.getElementById("pdprice").value) || 0;
                document.getElementById("pdamount").value = num * price;
            }

            // 2. 加载销售明细列表 (带商品名称关联)
            async function updatedata() {
                // 使用 Supabase 联表查询：获取 sale 记录，并内联查询 product 表的 name
                const { data: jsonstr, error } = await supabaseClient
                    .from('sale')
                    .select(`
                        id,
                        date,
                        pid,
                        price,
                        number,
                        amount,
                        cost,
                        remark,
                        product:pid (name)
                    `)
                    .order('date', { ascending: false })
                    .order('id', { ascending: false })
                    .limit(20); // 默认显示最近50条，可按需调整

                if (error) {
                    console.error('获取销售列表失败:', error);
                    return;
                }

                var myul = document.getElementById("salelist");
                myul.innerHTML = "";

                for (var i = 0; i < jsonstr.length; i++) {
                    let item = jsonstr[i];
                    let productName = item.product ? item.product.name : '未分类';

                    let li = document.createElement("li");
                    let div = document.createElement("div");
                    let d = document.createElement("p");
                    d.innerHTML = item.date.substring(0, 10);

                    let a = document.createElement("a");
                    a.href = "#";
                    a.setAttribute("onclick", "delrec(" + item.id + ")");
                    a.setAttribute("style", "float:right");
                    a.innerHTML = "删除";
                    d.appendChild(a);

                    let h = document.createElement("h4");
                    h.innerHTML = productName;

                    let p = document.createElement("h5");
                    p.setAttribute('style', "float:right");
                    let profit = (item.amount - item.cost).toFixed(2);
                    p.innerHTML = item.number + "X" + item.price + "=" + item.amount + "-" + item.cost + "=<span style='color:red'>" + profit + "</span>";

                    let m = document.createElement("p");
                    m.setAttribute('style', "text-align:right");
                    m.innerHTML = item.remark || '';

                    div.appendChild(d);
                    div.appendChild(h);
                    div.appendChild(p);
                    div.appendChild(m);
                    li.appendChild(div);
                    myul.appendChild(li);
                }
            }

            // 3. 提交新销售单
            async function submitSale(e) {
                e.preventDefault();

                const body = {
                    date: document.getElementById('sdate').value,
                    pid: Number(document.getElementById('pid').value),
                    number: Number(document.getElementById('pdnum').value),
                    price: Number(document.getElementById('pdprice').value),
                    amount: Number(document.getElementById('pdamount').value),
                    cost: Number(document.getElementById('pdcost').value),
                    remark: document.getElementById('remark').value,
                };

                if (!body.date || !body.pid || !body.number) {
                    alert('日期、商品、数量不能为空');
                    return;
                }

                const { data, error } = await supabaseClient
                    .from('sale')
                    .insert([body]);

                if (error) {
                    alert('提交失败: ' + error.message);
                } else {
                    document.getElementById('sidebar_right').style.width = '0';
                    updatedata();
                    show_msg("更新成功！");
                }
            }

            // 4. 删除销售记录
            async function delrec(id) {
                if (confirm('确定要删除这笔记录(id:' + id + ')吗？')) {
                    const { error } = await supabaseClient
                        .from('sale')
                        .delete()
                        .eq('id', id);

                    if (error) {
                        alert('删除失败: ' + error.message);
                    } else {
                        updatedata();
                        show_msg("删除成功！");
                    }
                }
            }

            // 5. 统计查询逻辑
            async function sum() {
                var start_date = document.getElementById('start_date').value;
                var end_date = document.getElementById('end_date').value;
                var type = document.getElementById('find_style').value;

                if (!start_date || !end_date) {
                    alert('请选择统计起止日期');
                    return;
                }

                document.getElementById('sidebar_left').style.width = '0';

                // 获取日期范围内的明细，然后在前端进行聚合计算
                const { data, error } = await supabaseClient
                    .from('sale')
                    .select(`
                        id,
                        date,
                        pid,
                        price,
                        number,
                        amount,
                        cost,
                        remark,
                        product:pid (name)
                    `)
                    .gte('date', start_date)
                    .lte('date', end_date)
                    .order('date', { ascending: true });

                if (error) {
                    alert('统计查询失败: ' + error.message);
                    return;
                }

                var myul = document.getElementById("salelist");
                myul.innerHTML = "";

                var headerLi = document.createElement("li");
                headerLi.setAttribute('style', "height:30px;background:#f0f0f0;font-weight:bold;");
                var headerText = document.createElement("span");
                headerText.innerHTML = "统计区间：" + start_date + " 至 " + end_date + "  |  " + getTypeName(type);
                headerLi.appendChild(headerText);
                myul.appendChild(headerLi);

                // 根据不同类型进行前端聚合或展示
                if (type === 'monthly') {
                    renderMonthlySummary(myul, data);
                } else if (type === 'daily') {
                    renderDailySummary(myul, data);
                } else if (type === 'product') {
                    renderProductSummary(myul, data);
                } else {
                    renderList(myul, data);
                }

                var backLi = document.createElement("li");
                backLi.setAttribute('style', "height:30px;border-top:2px solid #ddd;margin-top:10px;");
                var backA = document.createElement("a");
                backA.href = "#";
                backA.setAttribute("onclick", "updatedata()");
                backA.setAttribute("style", "float:right;color:#007aff;text-decoration:underline;");
                backA.innerHTML = "返回日常明细";
                backLi.appendChild(backA);
                myul.appendChild(backLi);
            }

            function getTypeName(type) {
                var names = {'monthly':'月汇总表','daily':'日汇总表','product':'商品汇总表','list':'明细表'};
                return names[type] || type;
            }

            // 聚合函数：月汇总
            function renderMonthlySummary(container, data) {
                let map = {};
                for (let row of data) {
                    let month = row.date.substring(0, 7);
                    if (!map[month]) map[month] = { month, total_amount: 0, total_profit: 0 };
                    map[month].total_amount += row.amount;
                    map[month].total_profit += (row.amount - row.cost);
                }
                let totalAmount = 0, totalProfit = 0;
                for (let k in map) {
                    let item = map[k];
                    let li = document.createElement("li");
                    li.setAttribute('style', "height:28px;line-height:28px;border-bottom:1px solid #eee;");
                    li.innerHTML = `<span>${item.month}</span><span style='margin-left:30px;'>销售金额:${formatNum(item.total_amount)}</span><span style='float:right;'>毛利:${formatNum(item.total_profit)}</span>`;
                    container.appendChild(li);
                    totalAmount += item.total_amount;
                    totalProfit += item.total_profit;
                }
                addTotalRow(container, totalAmount, totalProfit);
            }

            // 聚合函数：日汇总
            function renderDailySummary(container, data) {
                let map = {};
                for (let row of data) {
                    let date = row.date.substring(0, 10);
                    if (!map[date]) map[date] = { date, count: 0, total_amount: 0, total_profit: 0 };
                    map[date].count += 1;
                    map[date].total_amount += row.amount;
                    map[date].total_profit += (row.amount - row.cost);
                }
                let totalAmount = 0, totalProfit = 0;
                for (let k in map) {
                    let item = map[k];
                    let li = document.createElement("li");
                    li.setAttribute('style', "height:28px;line-height:28px;border-bottom:1px solid #eee;");
                    li.innerHTML = `<span>${item.date}</span><span style='margin-left:30px;color:#888;'>(${item.count}笔)</span><span style='margin-left:10px;'>销售金额:${formatNum(item.total_amount)}</span><span style='float:right;'>毛利:${formatNum(item.total_profit)}</span>`;
                    container.appendChild(li);
                    totalAmount += item.total_amount;
                    totalProfit += item.total_profit;
                }
                addTotalRow(container, totalAmount, totalProfit);
            }

            // 聚合函数：商品汇总
            function renderProductSummary(container, data) {
                let map = {};
                for (let row of data) {
                    let pName = row.product ? row.product.name : '未分类';
                    if (!map[pName]) map[pName] = { productName: pName, total_number: 0, total_amount: 0, total_profit: 0 };
                    map[pName].total_number += row.number;
                    map[pName].total_amount += row.amount;
                    map[pName].total_profit += (row.amount - row.cost);
                }
                let totalAmount = 0, totalProfit = 0;
                for (let k in map) {
                    let item = map[k];
                    let li = document.createElement("li");
                    li.setAttribute('style', "height:28px;line-height:28px;border-bottom:1px solid #eee;");
                    li.innerHTML = `<span>${item.productName}</span><span style='margin-left:30px;'>${item.total_number}件</span><span style='margin-left:10px;'>${formatNum(item.total_amount)}</span><span style='float:right;'>毛利:${formatNum(item.total_profit)}</span>`;
                    container.appendChild(li);
                    totalAmount += item.total_amount;
                    totalProfit += item.total_profit;
                }
                addTotalRow(container, totalAmount, totalProfit);
            }

            function renderList(container, data) {
                for (var i = 0; i < data.length; i++) {
                    let row = data[i];
                    let productName = row.product ? row.product.name : '未分类';
                    var li = document.createElement("li");
                    var div = document.createElement("div");
                    var d = document.createElement("p"); d.innerHTML = row.date.substring(0, 10);
                    var a = document.createElement("a"); a.href = "#"; a.setAttribute("onclick","delrec(" + row.id + ")"); a.setAttribute("style","float:right;"); a.innerHTML = "删除"; d.appendChild(a);
                    var h = document.createElement("h4"); h.innerHTML = productName;
                    var p = document.createElement("h5"); p.setAttribute('style',"float:right;");
                    p.innerHTML = row.number + "X" + row.price + "=" + row.amount + "-" + row.cost + "=<span style='color:red'>" + (row.amount - row.cost).toFixed(2) + "</span>";
                    var m = document.createElement("p"); m.setAttribute('style',"text-align:right;"); m.innerHTML = row.remark || '';
                    div.appendChild(d); div.appendChild(h); div.appendChild(p); div.appendChild(m);
                    li.appendChild(div); container.appendChild(li);
                }
                if (data.length === 0) {
                    var emptyLi = document.createElement("li");
                    emptyLi.innerHTML = "<span style='color:#999;padding:20px;text-align:center;display:block;'>该时间段无销售记录</span>";
                    container.appendChild(emptyLi);
                }
            }

            function addTotalRow(container, totalAmount, totalProfit) {
                var totalLi = document.createElement("li");
                totalLi.setAttribute('style', "height:32px;line-height:32px;background:#fff8e1;font-weight:bold;border-top:2px solid #ffc107;");
                totalLi.innerHTML = `<span>合  计</span><span style='margin-left:30px;color:#d32f2f;'>销售总金额:${formatNum(totalAmount)}</span><span style='float:right;color:#2e7d32;'>总毛利:${formatNum(totalProfit)}</span>`;
                container.appendChild(totalLi);
            }

            function formatNum(val) {
                var num = parseFloat(val);
                if (isNaN(num)) return "0.00";
                return num.toFixed(2);
            }

            function show_msg(msg) {
                var x = document.getElementById("snackbar");
                x.className = "show";
                x.innerHTML = msg;
                setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
            }
        </script>
    </body>
</html>
